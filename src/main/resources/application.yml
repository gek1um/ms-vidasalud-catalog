server:
  port: 8083


spring:

  profiles:
    active: dev

  application:
    name: ms-vidasalud-catalog


  # =====================================================
  # POSTGRESQL
  # =====================================================

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5434/vidasalud_catalog}
    username: ${POSTGRES_USERNAME:catalog_user}
    password: ${POSTGRES_PASSWORD:catalog_dev_password}
    driver-class-name: org.postgresql.Driver


  # =====================================================
  # JPA / HIBERNATE
  # =====================================================

  jpa:

    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

    show-sql: true


  # =====================================================
  # FLYWAY
  # =====================================================

  flyway:
    enabled: true
    locations: classpath:db/migration


  # =====================================================
  # SECURITY
  # =====================================================

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:693f1bd3-eae2-4b95-93b1-3825e6299250}/v2.0

# =======================================================
# ACTUATOR
# =======================================================

management:

  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always