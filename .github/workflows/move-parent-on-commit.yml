name: Move parent issue to In Progress

on:
  push:
    branches:
      - 'feature/**'

jobs:
  move-parent:
    # No reaccionar únicamente a creación/eliminación de refs.
    if: github.event.created == false && github.event.deleted == false

    runs-on: ubuntu-latest

    env:
      PROJECT_OWNER: 'gek1um'
      PROJECT_NUMBER: '1'
      TARGET_STATUS: 'In Progress'

    steps:
      # ---------------------------------------------------------
      # 1. Obtener número del sub-issue desde la branch
      # feature/5-configurar-estructura -> #5
      # ---------------------------------------------------------
      - name: Extract sub-issue number
        id: subissue
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          echo "Branch: $BRANCH"

          if [[ "$BRANCH" =~ ^feature/([0-9]+)- ]]; then

            ISSUE_NUMBER="${BASH_REMATCH[1]}"

            echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

            echo "Detected issue #$ISSUE_NUMBER"

          else

            echo "Branch does not match feature/<issue-number>-..."
            exit 1

          fi

      # ---------------------------------------------------------
      # 2. Obtener Parent Issue
      # ---------------------------------------------------------
      - name: Get parent issue
        id: parent
        env:
          GH_TOKEN: ${{ secrets.VIDASALUD_PROJECT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.subissue.outputs.number }}
        shell: bash
        run: |
          echo "Looking for parent of issue #$ISSUE_NUMBER..."

          PARENT_JSON=$(gh api \
            "repos/$REPOSITORY/issues/$ISSUE_NUMBER/parent")

          PARENT_NUMBER=$(echo "$PARENT_JSON" | jq -r '.number')
          PARENT_URL=$(echo "$PARENT_JSON" | jq -r '.html_url')

          echo "number=$PARENT_NUMBER" >> "$GITHUB_OUTPUT"
          echo "url=$PARENT_URL" >> "$GITHUB_OUTPUT"

          echo "Parent issue: #$PARENT_NUMBER"
          echo "Parent URL: $PARENT_URL"

      # ---------------------------------------------------------
      # 3. Obtener Project + Parent item + Status
      # ---------------------------------------------------------
      - name: Get project information
        id: project
        env:
          GH_TOKEN: ${{ secrets.VIDASALUD_PROJECT_TOKEN }}
          PARENT_URL: ${{ steps.parent.outputs.url }}
        shell: bash
        run: |
          echo "Searching Parent inside VidaSalud Project..."

          gh api graphql \
            -f query='
              query($login: String!, $number: Int!) {

                user(login: $login) {

                  projectV2(number: $number) {

                    id

                    fields(first: 100) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name

                          options {
                            id
                            name
                          }
                        }
                      }
                    }

                    items(first: 100) {
                      nodes {

                        id

                        content {
                          ... on Issue {
                            url
                          }
                        }

                        fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            name
                          }
                        }

                      }
                    }

                  }
                }
              }
            ' \
            -f login="$PROJECT_OWNER" \
            -F number="$PROJECT_NUMBER" \
            > /tmp/project.json


          PROJECT_ID=$(jq -r \
            '.data.user.projectV2.id' \
            /tmp/project.json)


          ITEM_ID=$(jq -r \
            --arg URL "$PARENT_URL" \
            '.data.user.projectV2.items.nodes[]
             | select(.content.url == $URL)
             | .id' \
            /tmp/project.json \
            | head -n 1)


          CURRENT_STATUS=$(jq -r \
            --arg URL "$PARENT_URL" \
            '.data.user.projectV2.items.nodes[]
             | select(.content.url == $URL)
             | .fieldValueByName.name // empty' \
            /tmp/project.json \
            | head -n 1)


          STATUS_FIELD_ID=$(jq -r \
            '.data.user.projectV2.fields.nodes[]
             | select(.name == "Status")
             | .id' \
            /tmp/project.json \
            | head -n 1)


          STATUS_OPTION_ID=$(jq -r \
            --arg STATUS "$TARGET_STATUS" \
            '.data.user.projectV2.fields.nodes[]
             | select(.name == "Status")
             | .options[]
             | select(.name == $STATUS)
             | .id' \
            /tmp/project.json \
            | head -n 1)


          if [[ -z "$PROJECT_ID" || "$PROJECT_ID" == "null" ]]; then
            echo "ERROR: Project not found."
            exit 1
          fi


          if [[ -z "$ITEM_ID" || "$ITEM_ID" == "null" ]]; then
            echo "ERROR: Parent issue is not in the Project."
            exit 1
          fi


          if [[ -z "$STATUS_FIELD_ID" || "$STATUS_FIELD_ID" == "null" ]]; then
            echo "ERROR: Status field not found."
            exit 1
          fi


          if [[ -z "$STATUS_OPTION_ID" || "$STATUS_OPTION_ID" == "null" ]]; then
            echo "ERROR: '$TARGET_STATUS' option not found."
            exit 1
          fi


          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "item_id=$ITEM_ID" >> "$GITHUB_OUTPUT"

          echo "current_status=$CURRENT_STATUS" >> "$GITHUB_OUTPUT"

          echo "status_field_id=$STATUS_FIELD_ID" >> "$GITHUB_OUTPUT"
          echo "status_option_id=$STATUS_OPTION_ID" >> "$GITHUB_OUTPUT"


          echo "Current parent status: '$CURRENT_STATUS'"

      # ---------------------------------------------------------
      # 4. Decidir si corresponde moverlo
      # ---------------------------------------------------------
      - name: Check status transition
        id: transition
        env:
          CURRENT_STATUS: ${{ steps.project.outputs.current_status }}
        shell: bash
        run: |
          case "$CURRENT_STATUS" in

            "Backlog"|"To Do"|"")

              echo "allowed=true" >> "$GITHUB_OUTPUT"

              echo "Parent will move:"
              echo "$CURRENT_STATUS -> $TARGET_STATUS"

              ;;


            *)

              echo "allowed=false" >> "$GITHUB_OUTPUT"

              echo "Parent already has status '$CURRENT_STATUS'."
              echo "No change required."

              ;;

          esac

      # ---------------------------------------------------------
      # 5. Cambiar Status -> In Progress
      # ---------------------------------------------------------
      - name: Move parent to In Progress
        if: steps.transition.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.VIDASALUD_PROJECT_TOKEN }}

          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          ITEM_ID: ${{ steps.project.outputs.item_id }}

          STATUS_FIELD_ID: ${{ steps.project.outputs.status_field_id }}
          STATUS_OPTION_ID: ${{ steps.project.outputs.status_option_id }}
        shell: bash
        run: |
          echo "Moving Parent to '$TARGET_STATUS'..."

          gh api graphql \
            -f query='
              mutation(
                $project: ID!,
                $item: ID!,
                $field: ID!,
                $option: String!
              ) {

                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $project
                    itemId: $item
                    fieldId: $field

                    value: {
                      singleSelectOptionId: $option
                    }
                  }
                ) {

                  projectV2Item {
                    id
                  }

                }

              }
            ' \
            -f project="$PROJECT_ID" \
            -f item="$ITEM_ID" \
            -f field="$STATUS_FIELD_ID" \
            -f option="$STATUS_OPTION_ID"

          echo "Parent successfully moved to '$TARGET_STATUS'."
