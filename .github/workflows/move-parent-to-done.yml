name: Move parent issue to Done when closed

on:
  issues:
    types:
      - closed

permissions:
  contents: read
  issues: read

jobs:
  move-parent-to-done:
    runs-on: ubuntu-latest

    env:
      # Dueño del GitHub Project
      PROJECT_OWNER: 'gek1um'

      # Ejemplo:
      # https://github.com/users/gek1um/projects/3
      # PROJECT_NUMBER = 3
      PROJECT_NUMBER: '1'

      SOURCE_STATUS: 'In Review'
      TARGET_STATUS: 'Done'

    steps:
      # ---------------------------------------------------------
      # 1. Comprobar que el Issue cerrado NO sea un sub-issue
      #
      # Si tiene Parent, no hacemos nada.
      # Solo queremos actuar cuando se cierre el Issue padre.
      # ---------------------------------------------------------
      - name: Check if closed issue is a parent issue
        id: issue-type
        env:
          GH_TOKEN: ${{ secrets.VIDASALUD_PROJECT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          echo "Checking issue #$ISSUE_NUMBER..."

          if gh api \
            "repos/$REPOSITORY/issues/$ISSUE_NUMBER/parent" \
            >/dev/null 2>&1; then

            echo "is_parent=false" >> "$GITHUB_OUTPUT"
            echo "Issue #$ISSUE_NUMBER is a sub-issue."
            echo "Nothing will be changed."

          else

            echo "is_parent=true" >> "$GITHUB_OUTPUT"
            echo "Issue #$ISSUE_NUMBER does not have a parent."
            echo "It can be treated as a parent issue."

          fi

      # ---------------------------------------------------------
      # 2. Obtener información del Project y localizar el Parent
      # ---------------------------------------------------------
      - name: Get project information
        if: steps.issue-type.outputs.is_parent == 'true'
        id: project
        env:
          GH_TOKEN: ${{ secrets.VIDASALUD_PROJECT_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        shell: bash
        run: |
          echo "Searching issue in VidaSalud Project..."

          gh api graphql \
            -f query='
              query($login: String!, $number: Int!) {
                user(login: $login) {
                  projectV2(number: $number) {

                    id

                    fields(first: 100) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }

                    items(first: 100) {
                      nodes {
                        id

                        content {
                          ... on Issue {
                            url
                          }
                        }

                        fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            ' \
            -f login="$PROJECT_OWNER" \
            -F number="$PROJECT_NUMBER" \
            > /tmp/project.json


          PROJECT_ID=$(jq -r \
            '.data.user.projectV2.id' \
            /tmp/project.json)


          ITEM_ID=$(jq -r \
            --arg URL "$ISSUE_URL" \
            '.data.user.projectV2.items.nodes[]
             | select(.content.url == $URL)
             | .id' \
            /tmp/project.json | head -n 1)


          CURRENT_STATUS=$(jq -r \
            --arg URL "$ISSUE_URL" \
            '.data.user.projectV2.items.nodes[]
             | select(.content.url == $URL)
             | .fieldValueByName.name // ""' \
            /tmp/project.json | head -n 1)


          STATUS_FIELD_ID=$(jq -r \
            '.data.user.projectV2.fields.nodes[]
             | select(.name == "Status")
             | .id' \
            /tmp/project.json | head -n 1)


          STATUS_OPTION_ID=$(jq -r \
            --arg STATUS "$TARGET_STATUS" \
            '.data.user.projectV2.fields.nodes[]
             | select(.name == "Status")
             | .options[]
             | select(.name == $STATUS)
             | .id' \
            /tmp/project.json | head -n 1)


          if [[ -z "$PROJECT_ID" || "$PROJECT_ID" == "null" ]]; then
            echo "ERROR: Project not found."
            exit 1
          fi


          if [[ -z "$ITEM_ID" || "$ITEM_ID" == "null" ]]; then
            echo "Issue is not inside the VidaSalud Project."
            echo "No change will be made."

            echo "in_project=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi


          if [[ -z "$STATUS_FIELD_ID" || "$STATUS_FIELD_ID" == "null" ]]; then
            echo "ERROR: Status field not found."
            exit 1
          fi


          if [[ -z "$STATUS_OPTION_ID" || "$STATUS_OPTION_ID" == "null" ]]; then
            echo "ERROR: Status '$TARGET_STATUS' not found."
            exit 1
          fi


          echo "in_project=true" >> "$GITHUB_OUTPUT"

          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "item_id=$ITEM_ID" >> "$GITHUB_OUTPUT"

          echo "current_status=$CURRENT_STATUS" >> "$GITHUB_OUTPUT"

          echo "status_field_id=$STATUS_FIELD_ID" >> "$GITHUB_OUTPUT"
          echo "status_option_id=$STATUS_OPTION_ID" >> "$GITHUB_OUTPUT"

          echo "Current status: $CURRENT_STATUS"

      # ---------------------------------------------------------
      # 3. Verificar que realmente esté en In Review
      #
      # Solo permitimos:
      #
      # In Review -> Done
      #
      # NO:
      # Backlog -> Done
      # To Do -> Done
      # In Progress -> Done
      # ---------------------------------------------------------
      - name: Validate status transition
        if: >
          steps.issue-type.outputs.is_parent == 'true' &&
          steps.project.outputs.in_project == 'true'
        id: transition
        env:
          CURRENT_STATUS: ${{ steps.project.outputs.current_status }}
        shell: bash
        run: |
          echo "Current status: '$CURRENT_STATUS'"
          echo "Required status: '$SOURCE_STATUS'"

          if [[ "$CURRENT_STATUS" == "$SOURCE_STATUS" ]]; then

            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "Transition allowed: $SOURCE_STATUS -> $TARGET_STATUS"

          else

            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Issue is not in '$SOURCE_STATUS'."
            echo "No Project status change will be performed."

          fi

      # ---------------------------------------------------------
      # 4. Mover In Review -> Done
      # ---------------------------------------------------------
      - name: Move parent issue to Done
        if: steps.transition.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.VIDASALUD_PROJECT_TOKEN }}

          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          ITEM_ID: ${{ steps.project.outputs.item_id }}

          STATUS_FIELD_ID: ${{ steps.project.outputs.status_field_id }}
          STATUS_OPTION_ID: ${{ steps.project.outputs.status_option_id }}

          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          echo "Moving parent issue #$ISSUE_NUMBER to '$TARGET_STATUS'..."

          gh api graphql \
            -f query='
              mutation(
                $project: ID!,
                $item: ID!,
                $field: ID!,
                $option: String!
              ) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $project
                    itemId: $item
                    fieldId: $field
                    value: {
                      singleSelectOptionId: $option
                    }
                  }
                ) {
                  projectV2Item {
                    id
                  }
                }
              }
            ' \
            -f project="$PROJECT_ID" \
            -f item="$ITEM_ID" \
            -f field="$STATUS_FIELD_ID" \
            -f option="$STATUS_OPTION_ID"

          echo "Parent issue #$ISSUE_NUMBER moved successfully:"
          echo "$SOURCE_STATUS -> $TARGET_STATUS"
