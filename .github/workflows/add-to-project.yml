name: Add epics to VidaSalud Project

on:
  issues:
    types:
      - opened
      - labeled

jobs:
  add-to-project:
    if: contains(github.event.issue.labels.*.name, 'epic')
    name: Add epic to VidaSalud Kanban
    runs-on: ubuntu-latest

    steps:
      - name: Add epic to project
        uses: actions/add-to-project@v2
        with:
          project-url: https://github.com/users/gek1um/projects/1
          github-token: ${{ secrets.VIDASALUD_PROJECT_TOKEN }}
          labeled: epic
          label-operator: OR
