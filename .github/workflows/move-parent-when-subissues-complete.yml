name: Move parent to In Review when sub-issues are complete

on:
  issues:
    types:
      - closed

permissions:
  contents: read
  issues: read

jobs:
  check-parent:
    runs-on: ubuntu-latest

    env:
      # Usuario dueño del GitHub Project
      PROJECT_OWNER: 'gek1um'

      # Número de tu Project.
      # Ejemplo:
      # https://github.com/users/gek1um/projects/3
      # PROJECT_NUMBER sería 3
      PROJECT_NUMBER: '1'

      TARGET_STATUS: 'In Review'

    steps:
      # ---------------------------------------------------------
      # 1. Comprobar si el Issue cerrado es un sub-issue
      # ---------------------------------------------------------
      - name: Check if closed issue is a sub-issue
        id: parent
        env:
          GH_TOKEN: ${{ secrets.VIDASALUD_PROJECT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          echo "Checking issue #$ISSUE_NUMBER..."

          if PARENT_JSON=$(gh api \
            "repos/$REPOSITORY/issues/$ISSUE_NUMBER/parent" \
            2>/dev/null); then

            PARENT_NUMBER=$(echo "$PARENT_JSON" | jq -r '.number')
            PARENT_URL=$(echo "$PARENT_JSON" | jq -r '.html_url')

            # Permite también padres de otro repo si algún día los usas
            PARENT_REPO=$(echo "$PARENT_JSON" \
              | jq -r '.repository_url | split("/repos/")[1]')

            echo "is_subissue=true" >> "$GITHUB_OUTPUT"
            echo "number=$PARENT_NUMBER" >> "$GITHUB_OUTPUT"
            echo "url=$PARENT_URL" >> "$GITHUB_OUTPUT"
            echo "repo=$PARENT_REPO" >> "$GITHUB_OUTPUT"

            echo "Sub-issue detected."
            echo "Parent: $PARENT_REPO#$PARENT_NUMBER"

          else

            echo "is_subissue=false" >> "$GITHUB_OUTPUT"
            echo "Issue #$ISSUE_NUMBER is not a sub-issue."

          fi

      # ---------------------------------------------------------
      # 2. Obtener todos los sub-issues del Parent
      # ---------------------------------------------------------
      - name: Check remaining sub-issues
        if: steps.parent.outputs.is_subissue == 'true'
        id: children
        env:
          GH_TOKEN: ${{ secrets.VIDASALUD_PROJECT_TOKEN }}
          PARENT_NUMBER: ${{ steps.parent.outputs.number }}
          PARENT_REPO: ${{ steps.parent.outputs.repo }}
        shell: bash
        run: |
          echo "Checking sub-issues of parent #$PARENT_NUMBER..."

          gh api \
            "repos/$PARENT_REPO/issues/$PARENT_NUMBER/sub_issues?per_page=100" \
            > /tmp/subissues.json

          TOTAL=$(jq 'length' /tmp/subissues.json)

          OPEN=$(jq \
            '[.[] | select(.state != "closed")] | length' \
            /tmp/subissues.json)

          CLOSED=$((TOTAL - OPEN))

          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "open=$OPEN" >> "$GITHUB_OUTPUT"
          echo "all_completed=false" >> "$GITHUB_OUTPUT"

          echo "Total: $TOTAL"
          echo "Closed: $CLOSED"
          echo "Open: $OPEN"

          if [[ "$TOTAL" -gt 0 && "$OPEN" -eq 0 ]]; then
            echo "all_completed=true" >> "$GITHUB_OUTPUT"
            echo "All sub-issues are complete!"
          else
            echo "Some sub-issues are still open."
          fi

      # ---------------------------------------------------------
      # 3. Obtener Project, Parent card, Status y opción In Review
      # ---------------------------------------------------------
      - name: Get project information
        if: >
          steps.parent.outputs.is_subissue == 'true' &&
          steps.children.outputs.all_completed == 'true'
        id: project
        env:
          GH_TOKEN: ${{ secrets.VIDASALUD_PROJECT_TOKEN }}
          PARENT_URL: ${{ steps.parent.outputs.url }}
        shell: bash
        run: |
          echo "Getting VidaSalud Project information..."

          gh api graphql \
            -f query='
              query($login: String!, $number: Int!) {
                user(login: $login) {
                  projectV2(number: $number) {

                    id

                    fields(first: 100) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name

                          options {
                            id
                            name
                          }
                        }
                      }
                    }

                    items(first: 100) {
                      nodes {
                        id

                        content {
                          ... on Issue {
                            url
                          }
                        }

                        fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            ' \
            -f login="$PROJECT_OWNER" \
            -F number="$PROJECT_NUMBER" \
            > /tmp/project.json


          PROJECT_ID=$(jq -r \
            '.data.user.projectV2.id' \
            /tmp/project.json)


          ITEM_ID=$(jq -r \
            --arg URL "$PARENT_URL" \
            '.data.user.projectV2.items.nodes[]
             | select(.content.url == $URL)
             | .id' \
            /tmp/project.json | head -n 1)


          CURRENT_STATUS=$(jq -r \
            --arg URL "$PARENT_URL" \
            '.data.user.projectV2.items.nodes[]
             | select(.content.url == $URL)
             | .fieldValueByName.name // ""' \
            /tmp/project.json | head -n 1)


          STATUS_FIELD_ID=$(jq -r \
            '.data.user.projectV2.fields.nodes[]
             | select(.name == "Status")
             | .id' \
            /tmp/project.json | head -n 1)


          STATUS_OPTION_ID=$(jq -r \
            --arg STATUS "$TARGET_STATUS" \
            '.data.user.projectV2.fields.nodes[]
             | select(.name == "Status")
             | .options[]
             | select(.name == $STATUS)
             | .id' \
            /tmp/project.json | head -n 1)


          if [[ -z "$PROJECT_ID" || "$PROJECT_ID" == "null" ]]; then
            echo "ERROR: Project not found."
            exit 1
          fi


          if [[ -z "$ITEM_ID" || "$ITEM_ID" == "null" ]]; then
            echo "Parent issue is not currently inside the Project."
            echo "No status change will be performed."

            echo "parent_in_project=false" >> "$GITHUB_OUTPUT"

            exit 0
          fi


          if [[ -z "$STATUS_FIELD_ID" || "$STATUS_FIELD_ID" == "null" ]]; then
            echo "ERROR: Status field not found."
            exit 1
          fi


          if [[ -z "$STATUS_OPTION_ID" || "$STATUS_OPTION_ID" == "null" ]]; then
            echo "ERROR: Status '$TARGET_STATUS' was not found."
            exit 1
          fi


          echo "parent_in_project=true" >> "$GITHUB_OUTPUT"

          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "item_id=$ITEM_ID" >> "$GITHUB_OUTPUT"

          echo "current_status=$CURRENT_STATUS" >> "$GITHUB_OUTPUT"

          echo "status_field_id=$STATUS_FIELD_ID" >> "$GITHUB_OUTPUT"
          echo "status_option_id=$STATUS_OPTION_ID" >> "$GITHUB_OUTPUT"

          echo "Current Parent status: $CURRENT_STATUS"

      # ---------------------------------------------------------
      # 4. Determinar si podemos moverlo a In Review
      #
      # Permitimos:
      #
      # Backlog     -> In Review
      # To Do       -> In Review
      # In Progress -> In Review
      #
      # NO permitimos:
      #
      # Testing -> In Review
      # Done    -> In Review
      # ---------------------------------------------------------
      - name: Determine if status should change
        if: >
          steps.parent.outputs.is_subissue == 'true' &&
          steps.children.outputs.all_completed == 'true' &&
          steps.project.outputs.parent_in_project == 'true'
        id: transition
        env:
          CURRENT_STATUS: ${{ steps.project.outputs.current_status }}
        shell: bash
        run: |
          case "$CURRENT_STATUS" in

            "Backlog"|"To Do"|"In Progress"|"")
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              echo "Parent can move to In Review."
              ;;

            *)
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              echo "Parent is already in '$CURRENT_STATUS'."
              echo "No backward transition will be made."
              ;;

          esac

      # ---------------------------------------------------------
      # 5. Mover Parent -> In Review
      # ---------------------------------------------------------
      - name: Move parent to In Review
        if: >
          steps.transition.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.VIDASALUD_PROJECT_TOKEN }}

          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          ITEM_ID: ${{ steps.project.outputs.item_id }}

          STATUS_FIELD_ID: ${{ steps.project.outputs.status_field_id }}
          STATUS_OPTION_ID: ${{ steps.project.outputs.status_option_id }}

          PARENT_NUMBER: ${{ steps.parent.outputs.number }}
        shell: bash
        run: |
          echo "Moving parent #$PARENT_NUMBER to '$TARGET_STATUS'..."

          gh api graphql \
            -f query='
              mutation(
                $project: ID!,
                $item: ID!,
                $field: ID!,
                $option: String!
              ) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $project
                    itemId: $item
                    fieldId: $field
                    value: {
                      singleSelectOptionId: $option
                    }
                  }
                ) {
                  projectV2Item {
                    id
                  }
                }
              }
            ' \
            -f project="$PROJECT_ID" \
            -f item="$ITEM_ID" \
            -f field="$STATUS_FIELD_ID" \
            -f option="$STATUS_OPTION_ID"

          echo "Parent #$PARENT_NUMBER moved successfully to '$TARGET_STATUS'."
