  services:

    postgres-catalog:
      image: postgres:16

      container_name: vidasalud-catalog-db

      restart: unless-stopped

      environment:
        POSTGRES_DB: vidasalud_catalog
        POSTGRES_USER: catalog_user
        POSTGRES_PASSWORD: catalog_dev_password

      ports:
        - "5434:5432"

      volumes:
        - catalog_postgres_data:/var/lib/postgresql/data

      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U catalog_user -d vidasalud_catalog" ]
        interval: 10s
        timeout: 5s
        retries: 5


  volumes:
    catalog_postgres_data: